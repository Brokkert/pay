name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Supabase pauses free projects that see too little traffic. One request a day
# is enough to prevent that. Fill in the same two values as in
# src/lib/config.js; while they are empty this workflow skips itself.
env:
  SUPABASE_URL: 'https://kybcuhpmnlhkomjsnozl.supabase.co'
  SUPABASE_KEY: 'sb_publishable_MN1g1l7SufRGrhTQ742mGQ_3pAkhkAH'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "No project configured yet; nothing to do."
            exit 0
          fi
          # pay_needs_bootstrap is the only function anon may call, and it reads
          # no data — exactly the right thing to knock on.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/pay_needs_bootstrap" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"
          [ "$code" = "200" ]
