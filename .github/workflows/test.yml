name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  database:
    # Runs schema.sql and its checks against a real PostgreSQL, so the
    # security model cannot drift unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
      - name: Run schema and checks
        run: |
          # initdb refuses to run as root, and the postgres user cannot reach
          # the runner's workspace; hence the copy.
          sudo cp -r supabase /var/tmp/pay-sql
          sudo chown -R postgres /var/tmp/pay-sql
          sudo -u postgres env \
            PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) \
            PAY_PGDATA=/var/tmp/pay-testdb \
            bash /var/tmp/pay-sql/run-tests.sh
