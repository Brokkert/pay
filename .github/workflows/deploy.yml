name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deployments from the
    # repository's default branch. That is currently the working branch, not
    # main, so both are listed here — a run on any other ref is rejected before
    # its first step, with a two-second failure and no log to explain it.
    # Once the default branch is main, the second entry can go.
    branches: [main, claude/shared-expenses-settlement-6hc5wo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          # smoke.mjs uses playwright, but CI runs vitest only — no reason to
          # pull a hundred-megabyte browser on every build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      # Note: "enablement: true" cannot switch Pages on for a repository where
      # it has never been enabled — the default GITHUB_TOKEN may not create a
      # Pages site, and the step then fails with "Resource not accessible by
      # integration". That is a one-time manual step:
      # Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
