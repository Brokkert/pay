name: Deploy to GitHub Pages

on:
  push:
    # Only the branch the github-pages environment allows. Every other ref is
    # turned away at the deploy job with no log to explain it, and because the
    # runs share a concurrency group a run that cannot deploy would cancel the
    # one that can — which is how a push once landed nowhere at all.
    #
    # main is the repository's default branch, but the environment still holds
    # the branch list from when this one was: Settings -> Environments ->
    # github-pages -> Deployment branches. Add main there and it can come back
    # here.
    branches: [claude/shared-expenses-settlement-6hc5wo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never at the cost of another: a queued run
# waits its turn instead of killing the one in front of it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          # smoke.mjs uses playwright, but CI runs vitest only — no reason to
          # pull a hundred-megabyte browser on every build.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      # Note: "enablement: true" cannot switch Pages on for a repository where
      # it has never been enabled — the default GITHUB_TOKEN may not create a
      # Pages site, and the step then fails with "Resource not accessible by
      # integration". That is a one-time manual step:
      # Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
